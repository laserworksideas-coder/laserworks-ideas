<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laserworks Ideas</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <div class="header-top">

    <div class="logo-area">
      <a href="index.html">
        <img src="logo.png" alt="Laserworks Ideas">
      </a>
    </div>

    <div class="contact-top">
      <div>Laserworksideas@gmail.com</div>
      <div>WhatsApp / Viber: +357 99 303580</div>
    </div>

  </div>

  <nav class="main-menu">
    <a href="index.html">HOME</a>
    <a href="index.html#categories">CATEGORIES</a>
    <a href="gallery.html">GALLERY</a>
    <a href="index.html#about">ABOUT US</a>
    <a href="index.html#ask-price">ASK FOR A PRICE</a>
    <a href="index.html#contact">CONTACT</a>
  </nav>

</header>


<main class="category-page">

  <section class="category-header">

    <h1 id="categoryTitle"></h1>

  </section>


  <!-- 3 FEATURED PHOTOS -->

  <section class="category-photos">

    <div class="category-photo">
      <img id="photo1" src="" alt="">
    </div>

    <div class="category-photo">
      <img id="photo2" src="" alt="">
    </div>

    <div class="category-photo">
      <img id="photo3" src="" alt="">
    </div>

  </section>


  <!-- WHAT WE OFFER -->

  <section class="what-we-offer">

    <h2>WHAT WE OFFER</h2>

    <ul id="offerList"></ul>

  </section>


  <!-- QUOTATION -->

  <section class="category-quotation">

    <a href="index.html#ask-price" class="quotation-button">
      ASK FOR A QUOTATION
    </a>

  </section>

</main>


<footer class="site-footer">

  <p>
    © 2026 Laserworks Ideas. All rights reserved.
  </p>

</footer>


<script src="products.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const category = params.get("category");

const title = document.getElementById("categoryTitle");

const offerList = document.getElementById("offerList");


/* CATEGORY TITLE */

title.textContent = category || "CATEGORY";


/* WHAT WE OFFER */

const offers = subcategories[category] || [];


offers.forEach(item => {

  const li = document.createElement("li");

  li.textContent = item;

  offerList.appendChild(li);

});


/* FEATURED PHOTOS */

const photos = featuredProducts[category] || [];


const photoElements = [
  document.getElementById("photo1"),
  document.getElementById("photo2"),
  document.getElementById("photo3")
];


photoElements.forEach((photo, index) => {

  if (photos[index]) {

    photo.src = photos[index];
    photo.alt = category;

  } else {

    photo.parentElement.style.display = "none";

  }

});

</script>

</body>
</html>
