<script src="products.js"></script>


<script>

function toggleMenu() {

  document
    .getElementById("mainNav")
    .classList.toggle("open");

}


/* ================= CATEGORY ================= */

const params =
  new URLSearchParams(window.location.search);

const requestedCategory =
  params.get("category") || "PERSONALISED GIFTS";


/*
  Website category
  -> existing products.js category
*/

const categoryMap = {

  "CHRISTENING": "CHRISTENING",

  "WEDDINGS": "WEDDING",

  "CORPORATE": "CORPORATE GIFTS",

  "SEASONAL": "SEASONAL ITEMS",

  "PERSONALISED GIFTS": "PERSONALISED GIFTS",

  "INVITATIONS": "INVITATIONS"

};


const titleMap = {

  "CHRISTENING": "CHRISTENING",

  "WEDDINGS": "WEDDINGS",

  "BIRTHDAYS": "BIRTHDAYS",

  "CORPORATE": "CORPORATE",

  "SCHOOLS": "SCHOOLS",

  "SEASONAL": "SEASONAL",

  "PERSONALISED GIFTS": "PERSONALISED GIFTS",

  "INVITATIONS": "INVITATIONS"

};


/* ================= PRODUCTS ================= */

function getProductsForCategory(category) {

  /*
    Existing categories from products.js
  */

  if (categoryMap[category]) {

    return products.filter(function(product) {

      return product.category === categoryMap[category];

    });

  }


  /*
    BIRTHDAYS

    Uses the birthday-related products
    already present in products.js.
  */

  if (category === "BIRTHDAYS") {

    return products.filter(function(product) {

      return (

        product.name
          .toLowerCase()
          .includes("cake topper")

        ||

        product.name
          .toLowerCase()
          .includes("cut out")

      );

    });

  }


  /*
    SCHOOLS

    Uses the school-related products
    already present in products.js.
  */

  if (category === "SCHOOLS") {

    return products.filter(function(product) {

      return (

        product.subcategory === "Pencil Cases"

        ||

        product.subcategory === "Educational"

      );

    });

  }


  return [];

}


/* ================= DISPLAY ================= */

function displayProducts() {

  const title =
    titleMap[requestedCategory] ||
    requestedCategory;

  document.getElementById(
    "categoryTitle"
  ).textContent = title;


  const container =
    document.getElementById(
      "categoryProducts"
    );


  const categoryProducts =
    getProductsForCategory(
      requestedCategory
    );


  if (!categoryProducts.length) {

    container.innerHTML = `
      <div class="no-products">
        Products for this category
        will be added soon.
      </div>
    `;

    return;

  }


  categoryProducts.forEach(function(product) {

    const image =
      product.images &&
      product.images.length
        ? product.images[0]
        : "";


    const imageHTML = image
      ? `<img src="${image}" alt="${product.name}">`
      : "";


    container.innerHTML += `

      <article class="category-product">

        <div class="category-product-image">

          ${imageHTML}

        </div>

        <div class="category-product-info">

          <h3>
            ${product.name}
          </h3>

          <p>
            ${product.description}
          </p>

          <strong>
            ${product.price}
          </strong>

        </div>

      </article>

    `;

  });

}


displayProducts();

</script>
