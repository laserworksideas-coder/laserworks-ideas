<script>
const galleryCategories = document.getElementById("galleryCategories");
const allPhotos = [
  "product-1.jpg","product-2.jpg","product-3.jpg","product-4.jpg","product-5.jpg",
  "product-6.jpg","product-7.jpg","product-8.jpg","product-9.jpg","product-10.jpg",
  "product-11.jpg","product-12.jpg","product-13.jpg","product-14.jpg","product-15.jpg",
  "product-16.jpg","product-17.jpg","product-18.jpg","product-19.jpg","product-20.jpg",
  "product-21.jpg","product-22.jpg","product-23.jpg","product-24.jpg","product-25.jpg",
  "product-26.jpg","product-27.jpg","product-28.jpg","product-29.jpg","product-30.jpg",
  "product-31.jpg","product-32.jpg","product-33.jpg","product-34.jpg","product-35.jpg",
  "product-37.jpg","product-38.jpg","product-39.jpg","product-40.jpg","product-41.jpg"
];
categories.forEach((category, categoryIndex) => {
  const section = document.createElement("section"); section.className = "gallery-category";
  const title = document.createElement("h2"); title.textContent = category; section.appendChild(title);
  const grid = document.createElement("div"); grid.className = "full-gallery";
  const start = categoryIndex * 3; const end = categoryIndex === categories.length - 1 ? allPhotos.length : start + 3;
  allPhotos.slice(start, end).forEach(image => {
    const item = document.createElement("div"); item.className = "full-gallery-item";
    const img = document.createElement("img"); img.src = image; img.alt = category; img.loading = "lazy"; item.appendChild(img); grid.appendChild(item);
  });
  section.appendChild(grid); galleryCategories.appendChild(section);
});

</script>
