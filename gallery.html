<script src="products.js"></script><script src="language.js?v=20260920a"></script>

<script>
const galleryCategories = document.getElementById("galleryCategories");

categories.forEach(category => {
  const section = document.createElement("section");
  section.className = "gallery-category";

  const title = document.createElement("h2");
  title.dataset.categoryName=category; title.textContent = trCategory(category);
  section.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "full-gallery";

  const photos = featuredProducts[category] || [];
  photos.forEach(image => {
    const item = document.createElement("div");
    item.className = "full-gallery-item";

    const img = document.createElement("img");
    img.src = image;
    img.alt = trCategory(category);
    img.loading = "lazy";

    item.appendChild(img);
    grid.appendChild(item);
  });

  if (!photos.length) {
    const empty = document.createElement("p");
    empty.textContent = tr("More products coming soon.");
    empty.style.fontSize = "14px";
    empty.style.color = "#777";
    grid.appendChild(empty);
  }

  section.appendChild(grid);
  galleryCategories.appendChild(section);
});
</script>
<script>window.addEventListener("languageChanged",()=>{document.querySelectorAll("[data-category-name]").forEach(el=>el.textContent=trCategory(el.dataset.categoryName));document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=tr(el.getAttribute("data-i18n")));});</script>
