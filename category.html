<script>
const params=new URLSearchParams(location.search),category=params.get("category")||"",title=document.getElementById("categoryTitle"),offerList=document.getElementById("offerList"),mainPhoto=document.getElementById("categoryMainPhoto"),track=document.getElementById("categorySliderTrack");
title.dataset.categoryName=category;title.textContent=trCategory(category);
(subcategories[category]||[]).forEach(item=>{const li=document.createElement("li");li.dataset.subcategory=item;li.textContent=trSub(item);offerList.appendChild(li);});
let photos=[];
function rawUrl(name){return "https://github.com/laserworksideas-coder/laserworks-ideas/raw/refs/heads/main/"+encodeURIComponent(category)+"/"+name.split("/").map(encodeURIComponent).join("/");}
function loadCategoryPhotos(){
 photos=(categoryPhotos[category]||[]).map(name=>({name,url:rawUrl(name)}));
 const preferred=mainCategoryPhotos[category];
 const main=photos.find(p=>preferred&&p.name.toLowerCase()===preferred.toLowerCase())||photos[0];
 if(main){const img=document.createElement("img");img.src=main.url;img.alt=category;mainPhoto.appendChild(img);}
 photos.slice(0,6).forEach((photo,i)=>{const card=document.createElement("div");card.className="category-slider-photo";const image=document.createElement("img");image.src=photo.url;image.alt=category;image.loading=i<3?"eager":"lazy";card.appendChild(image);track.appendChild(card);});
 catSetup();
}
let catIndex=0;
function catVisible(){return innerWidth<=800?2:3}
function catSetup(){const v=catVisible(),gap=14,w=(track.parentElement.clientWidth-(v-1)*gap)/v;track.querySelectorAll(".category-slider-photo").forEach(x=>{x.style.flex="0 0 "+w+"px";x.style.minWidth=w+"px"});catIndex=Math.min(catIndex,Math.max(0,photos.length-v));track.style.transform="translate3d("+(-catIndex*(w+gap))+"px,0,0)"}
function catMove(d){const v=catVisible(),max=Math.max(0,photos.length-v);catIndex+=d;if(catIndex<0)catIndex=max;if(catIndex>max)catIndex=0;const gap=14,w=(track.parentElement.clientWidth-(v-1)*gap)/v;track.style.transition="transform .3s ease";track.style.transform="translate3d("+(-catIndex*(w+gap))+"px,0,0)"}
document.querySelector(".category-slider-arrow.prev").onclick=()=>catMove(-1);document.querySelector(".category-slider-arrow.next").onclick=()=>catMove(1);addEventListener("resize",catSetup);
loadCategoryPhotos();
addEventListener("languageChanged",()=>{title.textContent=trCategory(category);offerList.querySelectorAll("[data-subcategory]").forEach(li=>li.textContent=trSub(li.dataset.subcategory))});
</script></body></html>
