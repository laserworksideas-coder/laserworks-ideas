<script src="products.js?v=20260922offers8"></script><script src="language.js?v=20260922menuflags2"></script><script>
const category=new URLSearchParams(location.search).get("category")||"",title=document.getElementById("categoryTitle"),list=document.getElementById("offerList"),main=document.getElementById("categoryMainPhoto"),gallery=document.getElementById("categoryGallery");title.textContent=trCategory(category);
(subcategories[category]||[]).forEach(x=>{const li=document.createElement("li");li.textContent=trSub(x);list.appendChild(li);});
let photos=[];async function loadPhotos(){const base="https://raw.githubusercontent.com/laserworksideas-coder/laserworks-ideas/main/";const cache="?v="+Date.now();const listed=(categoryPhotos[category]||[]);try{let discovered=[],page=1;while(true){const res=await fetch("https://api.github.com/repos/laserworksideas-coder/laserworks-ideas/contents/"+encodeURIComponent(category)+"?ref=main&per_page=100&page="+page);if(!res.ok)break;const files=await res.json();discovered.push(...files.filter(f=>f.type==="file"&&/\.(jpg|jpeg|png|webp)$/i.test(f.name)).map(f=>({name:f.name,sha:f.sha})));if(files.length<100)break;page++;if(page>10)break;}const all=[...listed.map(name=>({name,sha:null})),...discovered.filter(p=>!listed.includes(p.name))];const seen=new Set(),unique=[];for(const p of all){const key=p.sha||p.name.toLowerCase();if(!seen.has(key)){seen.add(key);unique.push(p);}}photos=unique.map(p=>({name:p.name,url:base+encodeURIComponent(category)+"/"+encodeURIComponent(p.name)+cache}));}catch(e){console.error(e);photos=listed.map(n=>({name:n,url:base+encodeURIComponent(category)+"/"+encodeURIComponent(n)+cache}));}render();const pref=mainCategoryPhotos[category],hero=photos.find(p=>pref&&p.name.toLowerCase()===pref.toLowerCase())||photos[0];if(hero)main.innerHTML='<img src="'+hero.url+'" alt="'+category+'">';}
let idx=0;function render(){gallery.innerHTML="";photos.slice(idx,idx+8).forEach(p=>{const d=document.createElement("div");d.className="cat-gallery-item";d.innerHTML='<img src="'+p.url+'" alt="'+category+'">';gallery.appendChild(d);});document.getElementById("prev").style.visibility=idx>0?"visible":"hidden";document.getElementById("next").style.visibility=idx+8<photos.length?"visible":"hidden";}document.getElementById("prev").onclick=()=>{idx=Math.max(0,idx-4);render()};document.getElementById("next").onclick=()=>{idx=Math.min(Math.max(0,photos.length-8),idx+4);render()};loadPhotos();
addEventListener("languageChanged",()=>{title.textContent=trCategory(category);list.querySelectorAll("li").forEach((li,i)=>li.textContent=trSub((subcategories[category]||[])[i]));});
</script></body></html>
