<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Laserworks Ideas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260920lang">
  <style>
    .gallery-category-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;max-width:1100px;margin:35px auto 60px;padding:0 20px}
    .gallery-category-tile{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e5e5e5;transition:transform .2s ease,box-shadow .2s ease;overflow:hidden}
    .gallery-category-tile:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
    .gallery-category-tile-image{width:100%;aspect-ratio:1/1;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .gallery-category-tile-image img{width:100%;height:100%;object-fit:contain}
    .gallery-category-tile h2{margin:0;padding:16px 12px 18px;text-align:center;font-size:21px;font-weight:500;letter-spacing:.5px}
    .gallery-category-tile h2::after{content:".";color:#d71920}
    @media(max-width:800px){.gallery-category-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:0 15px}.gallery-category-tile h2{font-size:18px;padding:13px 8px 15px}}
    @media(max-width:500px){.gallery-category-tiles{grid-template-columns:1fr;max-width:430px}}
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <div class="logo-area">
      <a href="index.html"><img src="LOGO.png" alt="Laserworks Ideas"></a>
    </div>
    <div class="contact-top">
      <div>Laserworksideas@gmail.com</div>
      <div>WhatsApp / Viber: +357 99 303580</div>
      <a class="header-message-button" href="mailto:Laserworksideas@gmail.com?subject=Laserworks%20Ideas%20-%20Message"><span data-i18n="SEND A MESSAGE">SEND A MESSAGE</span></a>
    </div>
  </div>

  <nav class="main-menu">
    <a href="index.html" data-i18n="HOME">HOME</a>
    <a href="index.html#categories" data-i18n="CATEGORIES">CATEGORIES</a>
    <a href="gallery.html" data-i18n="GALLERY">GALLERY</a>
    <a href="index.html#about" data-i18n="ABOUT US">ABOUT US</a>
    <a href="index.html#ask-price" data-i18n="ASK FOR A PRICE">ASK FOR A PRICE</a>
    <a href="index.html#contact" data-i18n="CONTACT">CONTACT</a>
  </nav>
</header>

<main class="gallery-page">
  <section class="gallery-intro">
    <h1 data-i18n="GALLERY">GALLERY</h1>
    <p><span data-i18n="Choose a category to see our work.">Choose a category to see our work.</span></p>
  </section>

  <div id="galleryCategories" class="gallery-category-tiles"></div>
</main>

<footer class="site-footer">
  <p>© 2026 Laserworks Ideas. All rights reserved.</p>
</footer>

<script src="products.js"></script>
<script src="language.js?v=20260920a"></script>
<script>
const galleryCategories = document.getElementById("galleryCategories");

categories.forEach(category => {
  const photos = featuredProducts[category] || [];
  const mainPhoto = photos[0];

  const link = document.createElement("a");
  link.className = "gallery-category-tile";
  link.href = "category.html?category=" + encodeURIComponent(category);

  const imageBox = document.createElement("div");
  imageBox.className = "gallery-category-tile-image";

  if (mainPhoto) {
    const img = document.createElement("img");
    img.src = mainPhoto;
    img.alt = trCategory(category);
    img.loading = "lazy";
    imageBox.appendChild(img);
  }

  const title = document.createElement("h2");
  title.dataset.categoryName = category;
  title.textContent = trCategory(category);

  link.appendChild(imageBox);
  link.appendChild(title);
  galleryCategories.appendChild(link);
});

window.addEventListener("languageChanged", () => {
  document.querySelectorAll("[data-category-name]").forEach(el => {
    el.textContent = trCategory(el.dataset.categoryName);
  });
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = tr(el.getAttribute("data-i18n"));
  });
});
</script>
</body>
</html>
