<body>

<header class="site-header">

  <div class="header-top">

    <div class="logo-area">
      <a href="index.html">
        <img src="LOGO.png" alt="Laserworks Ideas">
      </a>

    <div class="contact-top">
      <div>Laserworksideas@gmail.com</div>
      <div>WhatsApp / Viber: +357 99 303580</div>
      <a class="header-message-button" href="mailto:Laserworksideas@gmail.com?subject=Laserworks%20Ideas%20-%20Message">SEND A MESSAGE</a>
    </div>

  </div>

  <nav class="main-menu">
    <a href="index.html">HOME</a>
    <a href="index.html#categories">CATEGORIES</a>
    <a href="gallery.html">GALLERY</a>

</header>


<main class="category-page">

  <section class="category-header">

    <h1 id="categoryTitle"></h1>

  </section>


  <!-- 3 FEATURED PHOTOS -->

  <section class="category-photos">

    <div class="category-photo">
      <img id="photo1" src="" alt="">
    </div>

    <div class="category-photo">
      <img id="photo2" src="" alt="">
    </div>

    <div class="category-photo">
      <img id="photo3" src="" alt="">
    </div>

  </section>


  <!-- WHAT WE OFFER -->

  <section class="what-we-offer">

    <h2>WHAT WE OFFER</h2>

    <ul id="offerList"></ul>

  </section>


  <!-- QUOTATION -->

  <section class="category-quotation">

    <a href="index.html#ask-price" class="quotation-button">
      ASK FOR A QUOTATION
    </a>

  </section>

</main>


<footer class="site-footer">

  <p>
    © 2026 Laserworks Ideas. All rights reserved.
  </p>

</footer>


<script src="products.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const category = params.get("category");
document.getElementById("categoryTitle").textContent = category || "CATEGORY";

const offers = subcategories[category] || [];
const offerList = document.getElementById("offerList");
offers.forEach(item => {
  const li = document.createElement("li");
  li.textContent = item;
  offerList.appendChild(li);
});

const photos = featuredProducts[category] || [];
document.querySelectorAll(".category-photo img").forEach((photo, index) => {
  if (photos[index]) {
    photo.src = photos[index];
    photo.alt = category;
  } else {
    photo.parentElement.style.display = "none";
  }
});
</script>

</body>
