<script src="products.js"></script><script src="language.js?v=20260922structure1"></script><script>
const holder=document.getElementById("galleryCategories"),api="https://api.github.com/repos/laserworksideas-coder/laserworks-ideas/contents/";
async function getPhotos(cat){try{const r=await fetch(api+encodeURIComponent(cat)+"?ref=main");const a=await r.json();return Array.isArray(a)?a.filter(f=>f.type==="file"&&/\.(jpg|jpeg|png|webp|gif)$/i.test(f.name)):[]}catch(e){return[]}}
(async()=>{for(const cat of categories){const pics=await getPhotos(cat),pref=mainCategoryPhotos[cat],p=pics.find(x=>pref&&x.name.toLowerCase()===pref.toLowerCase())||pics[0];const a=document.createElement("a");a.className="gallery-new-card";a.href="category.html?category="+encodeURIComponent(cat);a.innerHTML='<div class="gallery-card-img">'+(p?'<img src="'+p.download_url+'" alt="'+trCategory(cat)+'">':'')+'</div><div class="gallery-card-text"><span>'+String(categories.indexOf(cat)+1).padStart(2,"0")+'</span><h2>'+trCategory(cat)+'</h2><b>VIEW →</b></div>';holder.appendChild(a);}})();
</script></body></html>
