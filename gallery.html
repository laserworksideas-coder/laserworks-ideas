<script>

/* MOBILE MENU */

const menuToggle =
  document.getElementById("menuToggle");

const mainNav =
  document.getElementById("mainNav");


menuToggle.addEventListener(
  "click",
  function () {

    mainNav.classList.toggle(
      "mobile-open"
    );

  }
);


document
  .querySelectorAll(".main-nav a")
  .forEach(link => {

    link.addEventListener(
      "click",
      function () {

        mainNav.classList.remove(
          "mobile-open"
        );

      }
    );

  });



/* FULL GALLERY */
