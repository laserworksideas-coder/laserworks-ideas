<script src="products.js"></script>

<script>
const galleryCategories = document.getElementById("galleryCategories");

categories.forEach(category => {
  const section = document.createElement("section");
  section.className = "gallery-category";

  const title = document.createElement("h2");
  title.textContent = category;
  section.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "full-gallery";

  const photos = featuredProducts[category] || [];
  photos.forEach(image => {
    const item = document.createElement("div");
    item.className = "full-gallery-item";

    const img = document.createElement("img");
    img.src = image;
    img.alt = category;
    img.loading = "lazy";

    item.appendChild(img);
    grid.appendChild(item);
  });

  if (!photos.length) {
    const empty = document.createElement("p");
    empty.textContent = "More products coming soon.";
    empty.style.fontSize = "14px";
    empty.style.color = "#777";
    grid.appendChild(empty);
  }

  section.appendChild(grid);
  galleryCategories.appendChild(section);
});
</script>

</body>
