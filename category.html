<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laserworks Ideas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <div class="header-top">

    <a href="index.html" class="logo">LASERWORKS IDEAS</a>

    <div class="contact-top">
      <span class="contact-title">CONTACT US</span>
      <a href="mailto:Laserworksideas@gmail.com">EMAIL</a>
      <a href="viber://chat?number=%2B35799303580">VIBER</a>
      <a href="https://wa.me/35799303580" target="_blank">WHATSUP</a>
    </div>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      ☰
    </button>

  </div>

  <nav class="main-nav" id="mainNav">
    <a href="index.html">HOME</a>
    <a href="index.html#categories">CATEGORIES</a>
    <a href="index.html#gallery">GALLERY</a>
    <a href="index.html#about">ABOUT US</a>
    <a href="index.html#contact">CONTACT</a>
  </nav>

</header>


<main>

  <section class="category-page">

    <div class="category-heading">
      <h1 id="categoryTitle">CATEGORY</h1>
      <p id="categoryDescription"></p>
    </div>

    <div id="productGrid" class="product-grid"></div>

    <div class="back-home">
      <a href="index.html#categories" class="red-button">
        BACK TO CATEGORIES
      </a>
    </div>

  </section>

</main>


<footer>
  <p>© 2026 LASERWORKS IDEAS — LIMASSOL, CYPRUS</p>
</footer>


<script src="products.js"></script>

<script>

/* MOBILE MENU */

const menuToggle = document.getElementById("menuToggle");
const mainNav = document.getElementById("mainNav");

menuToggle.addEventListener("click", function () {
  mainNav.classList.toggle("mobile-open");
});

document.querySelectorAll(".main-nav a").forEach(link => {
  link.addEventListener("click", function () {
    mainNav.classList.remove("mobile-open");
  });
});


/* CATEGORY */

const params = new URLSearchParams(window.location.search);
const category = params.get("category");

const title = document.getElementById("categoryTitle");
const description = document.getElementById("categoryDescription");
const grid = document.getElementById("productGrid");


const categoryNames = {
  "CHRISTENING": "CHRISTENING",
  "WEDDING": "WEDDINGS",
  "BIRTHDAY": "BIRTHDAYS",
  "CORPORATE GIFTS": "CORPORATE",
  "SCHOOLS": "SCHOOLS",
  "SEASONAL ITEMS": "SEASONAL",
  "PERSONALISED GIFTS": "PERSONALISED GIFTS",
  "INVITATIONS": "INVITATIONS"
};


const descriptions = {
  "CHRISTENING": "Personalised details and decorations for your special christening.",
  "WEDDING": "Custom laser cut and engraved details for weddings and celebrations.",
  "BIRTHDAY": "Personalised decorations, cake toppers and details for birthdays.",
  "CORPORATE GIFTS": "Custom corporate gifts and personalised business details.",
  "SCHOOLS": "Creative personalised products for schools and educational events.",
  "SEASONAL ITEMS": "Creative products for seasonal celebrations and special occasions.",
  "PERSONALISED GIFTS": "Unique personalised gifts created especially for you.",
  "INVITATIONS": "Custom invitations designed for your special event."
};


title.textContent =
  categoryNames[category] || category || "OUR PRODUCTS";

description.textContent =
  descriptions[category] ||
  "Explore our personalised laser cut and engraved creations.";


/*
  FILTER PRODUCTS
*/

let filteredProducts = [];


/* BIRTHDAYS */

if (category === "BIRTHDAY") {

  filteredProducts = products.filter(product => {

    const text = (
      (product.name || "") + " " +
      (product.description || "") + " " +
      (product.subcategory || "") + " " +
      (product.category || "")
    ).toLowerCase();

    return (
      text.includes("cake") ||
      text.includes("birthday") ||
      text.includes("topper")
    );

  });

}


/* SCHOOLS */

else if (category === "SCHOOLS") {

  filteredProducts = products.filter(product => {

    const text = (
      (product.name || "") + " " +
      (product.description || "") + " " +
      (product.subcategory || "") + " " +
      (product.category || "")
    ).toLowerCase();

    return (
      text.includes("school") ||
      text.includes("pencil") ||
      text.includes("educational") ||
      text.includes("bookmark")
    );

  });

}


/* ALL OTHER CATEGORIES */

else {

  filteredProducts = products.filter(product => {

    return String(product.category || "").trim().toUpperCase() ===
           String(category || "").trim().toUpperCase();

  });

}


/*
  DISPLAY PRODUCTS
*/

if (filteredProducts.length === 0) {

  grid.innerHTML = `
    <div class="no-products">
      <p>More products coming soon.</p>
    </div>
  `;

} else {

  filteredProducts.forEach(product => {

    const card = document.createElement("div");

    card.className = "product-card";

    card.innerHTML = `

      ${
        product.image
          ? `<img src="${product.image}" alt="${product.name || ""}">`
          : ""
      }

      <div class="product-info">

        ${
          product.name
            ? `<h2>${product.name}</h2>`
            : ""
        }

        ${
          product.description
            ? `<p>${product.description}</p>`
            : ""
        }

        ${
          product.price
            ? `<span class="product-price">${product.price}</span>`
            : ""
        }

      </div>

    `;

    grid.appendChild(card);

  });

}

</script>

</body>
</html>
```
