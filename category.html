  <script src="products.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search);

    const selectedCategory = params.get("category") || "";


    const categoryTitle = document.getElementById("categoryTitle");

    const productsContainer =
      document.getElementById("productsContainer");


    /*
      The website uses the new customer-facing category names,
      while products.js contains some of the older internal names.
    */

    const categoryMap = {

      "CHRISTENING": [
        "CHRISTENING"
      ],

      "WEDDINGS": [
        "WEDDING"
      ],

      "CORPORATE": [
        "CORPORATE GIFTS"
      ],

      "SEASONAL": [
        "SEASONAL ITEMS"
      ],

      "PERSONALISED GIFTS": [
        "PERSONALISED GIFTS"
      ],

      "INVITATIONS": [
        "INVITATIONS"
      ]

    };


    function getProductsForCategory(category) {

      if (!Array.isArray(products)) {
        return [];
      }


      /* CHRISTENING */
      if (category === "CHRISTENING") {

        return products.filter(product =>
          String(product.category || "").toUpperCase() === "CHRISTENING"
        );

      }


      /* WEDDINGS */
      if (category === "WEDDINGS") {

        return products.filter(product =>
          String(product.category || "").toUpperCase() === "WEDDING"
        );

      }


      /* CORPORATE */
      if (category === "CORPORATE") {

        return products.filter(product =>
          String(product.category || "").toUpperCase() === "CORPORATE GIFTS"
        );

      }


      /* SEASONAL */
      if (category === "SEASONAL") {

        return products.filter(product =>
          String(product.category || "").toUpperCase() === "SEASONAL ITEMS"
        );

      }


      /* PERSONALISED GIFTS */
      if (category === "PERSONALISED GIFTS") {

        return products.filter(product =>
          String(product.category || "").toUpperCase() === "PERSONALISED GIFTS"
        );

      }


      /* INVITATIONS */
      if (category === "INVITATIONS") {

        return products.filter(product =>
          String(product.category || "").toUpperCase() === "INVITATIONS"
        );

      }


      /*
        BIRTHDAYS:
        Products related to birthday/cake decorations
        from the existing product list.
      */

      if (category === "BIRTHDAYS") {

        return products.filter(product => {

          const text = (
            String(product.name || "") + " " +
            String(product.description || "") + " " +
            String(product.subcategory || "")
          ).toLowerCase();

          return (
            text.includes("cake") ||
            text.includes("birthday") ||
            text.includes("topper")
          );

        });

      }


      /*
        SCHOOLS:
        Products from the existing list that are
        associated with school / educational items.
      */

      if (category === "SCHOOLS") {

        return products.filter(product => {

          const text = (
            String(product.name || "") + " " +
            String(product.description || "") + " " +
            String(product.subcategory || "")
          ).toLowerCase();

          return (
            text.includes("school") ||
            text.includes("pencil") ||
            text.includes("educational") ||
            text.includes("bookmark")
          );

        });

      }


      return [];

    }


    function createProductCard(product) {

      const card = document.createElement("article");

      card.className = "product-card";


      if (product.image) {

        const image = document.createElement("img");

        image.src = product.image;

        image.alt = product.name || "Laserworks Ideas product";

        card.appendChild(image);

      }


      const content = document.createElement("div");

      content.className = "product-card-content";


      const title = document.createElement("h3");

      title.textContent =
        product.name || "Personalised Product";

      content.appendChild(title);


      if (product.description) {

        const description =
          document.createElement("p");

        description.textContent =
          product.description;

        content.appendChild(description);

      }


      if (product.price) {

        const price =
          document.createElement("p");

        price.className = "product-price";

        price.textContent =
          product.price;

        content.appendChild(price);

      }


      card.appendChild(content);

      return card;

    }


    function renderCategory() {

      const displayTitle =
        selectedCategory || "PRODUCTS";

      categoryTitle.textContent =
        displayTitle;


      const categoryProducts =
        getProductsForCategory(selectedCategory);


      productsContainer.innerHTML = "";


      if (categoryProducts.length === 0) {

        productsContainer.innerHTML = `
          <p style="
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
          ">
            Products coming soon.
          </p>
        `;

        return;

      }


      categoryProducts.forEach(product => {

        productsContainer.appendChild(
          createProductCard(product)
        );

      });

    }


    renderCategory();

  </script>

</body>
</html>
