(subcategories[category]||[]).forEach(x=>{const li=document.createElement("li");li.textContent=trSub(x);list.appendChild(li);});
let photos=[];
async function loadPhotos(){
  const base="https://raw.githubusercontent.com/laserworksideas-coder/laserworks-ideas/main/";
  const api="https://api.github.com/repos/laserworksideas-coder/laserworks-ideas/contents/"+encodeURIComponent(category)+"?ref=main";
  const fallback=(typeof categoryPhotos!=="undefined"&&Array.isArray(categoryPhotos[category]))?categoryPhotos[category]:[];
  try{
    const cr=await fetch(api+"&v="+Date.now(),{cache:"no-store"});
    if(!cr.ok) throw new Error("Could not read category folder");
    const files=await cr.json();
    const current=Array.isArray(files)
      ? files.filter(f=>f.type==="file"&&/\.(jpg|jpeg|png|webp|gif)$/i.test(f.name)).map(f=>f.name)
      : [];
    if(!current.length) throw new Error("No images found in category folder");

    let recent=[];
    try{
      const rr=await fetch("https://raw.githubusercontent.com/laserworksideas-coder/laserworks-ideas/main/recent-uploads.json?v="+Date.now(),{cache:"no-store"});
      if(rr.ok){
        const data=await rr.json();
        if(Array.isArray(data)){
          const prefix=category+"/";
          const present=new Set(current.map(n=>n.toLowerCase()));
          recent=data
            .filter(x=>x&&typeof x.path==="string"&&x.path.startsWith(prefix))
            .map(x=>x.path.slice(prefix.length))
            .filter(n=>present.has(n.toLowerCase()));
        }
      }
    }catch(e){}

    const ordered=[];
    const add=n=>{if(n&&!ordered.some(x=>x.toLowerCase()===n.toLowerCase())) ordered.push(n)};
    recent.forEach(add);
    current.forEach(add);
    photos=ordered.map(n=>({name:n,url:base+encodeURIComponent(category)+"/"+encodeURIComponent(n)+"?v="+Date.now()}));
  }catch(e){
    console.warn("Using saved category list:",e);
    photos=fallback.map(n=>({name:n,url:base+encodeURIComponent(category)+"/"+encodeURIComponent(n)+"?v="+Date.now()}));
  }
  render();
  const pref=typeof mainCategoryPhotos!=="undefined"?mainCategoryPhotos[category]:null;
  if(pref) main.innerHTML='<img src="'+base+encodeURIComponent(category)+'/'+encodeURIComponent(pref)+'?v='+Date.now()+'" alt="'+getImageAlt(category,pref)+'">';
}
let idx=0;
function render(){
  gallery.innerHTML="";
  photos.slice(idx,idx+8).forEach(p=>{
    const d=document.createElement("div");
    d.className="cat-gallery-item";
    d.innerHTML='<img src="'+p.url+'" alt="'+getImageAlt(category,p.name)+'">';
    gallery.appendChild(d);
  });
  document.getElementById("prev").style.visibility=idx>0?"visible":"hidden";
  document.getElementById("next").style.visibility=idx+8<photos.length?"visible":"hidden";
}
document.getElementById("prev").onclick=()=>{idx=Math.max(0,idx-4);render()};
document.getElementById("next").onclick=()=>{idx=Math.min(Math.max(0,photos.length-8),idx+4);render()};
loadPhotos();
