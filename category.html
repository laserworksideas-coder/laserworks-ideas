<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laserworks Ideas - Category</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <div class="header-top">

      <div class="logo-area">
        <a href="index.html">
          <img src="logo.png" alt="Laserworks Ideas">
        </a>
      </div>

      <div class="contact-top">
        <div>Laserworksideas@gmail.com</div>
        <div>WhatsApp / Viber: +357 99 303580</div>
      </div>

    </div>


    <!-- MENU -->
    <nav class="main-menu">

      <a href="index.html">HOME</a>

      <div class="menu-dropdown">
        <a href="index.html#categories">CATEGORIES</a>
      </div>

      <a href="gallery.html">GALLERY</a>

      <a href="index.html#about">ABOUT US</a>

      <a href="index.html#ask-price">ASK FOR A PRICE</a>

      <a href="index.html#contact">CONTACT</a>

    </nav>

  </header>


  <!-- CATEGORY PAGE -->
  <main class="category-page">

    <section class="category-header">

      <h1 id="categoryTitle"></h1>

      <p id="categoryDescription">
        Discover our personalised handmade creations.
      </p>

    </section>


    <!-- SUBCATEGORIES -->
    <section class="subcategory-section">

      <div
        id="subcategoryGrid"
        class="subcategory-grid">
      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <p>
      © 2026 Laserworks Ideas. All rights reserved.
    </p>

  </footer>


  <script src="products.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search);

    const category = params.get("category");

    const title = document.getElementById("categoryTitle");

    const description = document.getElementById("categoryDescription");

    const grid = document.getElementById("subcategoryGrid");


    /* CATEGORY TITLE */

    if (category) {

      title.textContent = category;

      description.textContent =
        "Explore our " + category.toLowerCase() + " creations.";

    } else {

      title.textContent = "CATEGORIES";

      description.textContent =
        "Explore our personalised handmade creations.";

    }


    /* SUBCATEGORIES */

    const list = subcategories[category] || [];


    if (list.length === 0) {

      grid.innerHTML = `
        <p class="no-subcategories">
          Products coming soon.
        </p>
      `;

    } else {

      list.forEach(subcategory => {

        const card = document.createElement("a");

        card.className = "subcategory-card";

        card.href =
          "category.html?category=" +
          encodeURIComponent(category) +
          "&subcategory=" +
          encodeURIComponent(subcategory);

        card.innerHTML = `
          <div class="subcategory-title">
            ${subcategory}
          </div>
        `;

        grid.appendChild(card);

      });

    }

  </script>

</body>
</html>
